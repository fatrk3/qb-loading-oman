<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>اليوم عُمان الوطني · OMAN NATIONAL DAY</title>

    <link rel="preload" as="image" href="img/bg-fort.jpg" />
    <link rel="preload" as="font" type="font/woff2" href="fonts/cairo-arabic-400-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/reem-kufi-arabic-700-normal.woff2" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- أيقونات -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
        <symbol id="i-discord" viewBox="0 0 24 24">
            <path d="M12 3.2c-4.9 0-8.8 3.4-8.8 7.6 0 2.4 1.3 4.6 3.4 6l-.7 3.4 3.6-1.9c.8.2 1.6.3 2.5.3 4.9 0 8.8-3.4 8.8-7.6S16.9 3.2 12 3.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="9" cy="11.2" r="1.15" fill="currentColor"/>
            <circle cx="15" cy="11.2" r="1.15" fill="currentColor"/>
        </symbol>
        <symbol id="i-youtube" viewBox="0 0 24 24">
            <rect x="2.5" y="5.5" width="19" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M10.2 9.3v5.4l4.6-2.7-4.6-2.7Z" fill="currentColor"/>
        </symbol>
        <symbol id="i-tiktok" viewBox="0 0 24 24">
            <path d="M14 4v10.2a3.4 3.4 0 1 1-3.2-3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M14 4c.3 2.3 1.7 3.7 4 3.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </symbol>
        <symbol id="i-instagram" viewBox="0 0 24 24">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="3.8" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="17.2" cy="6.9" r="1.1" fill="currentColor"/>
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24">
            <path d="M5.5 5.5 18.5 18.5M18.5 5.5 5.5 18.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </symbol>
        <symbol id="i-globe" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.3 3.6 8.5S14.4 18.2 12 20.5c-2.4-2.3-3.6-5.3-3.6-8.5S9.6 5.8 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </symbol>
        <symbol id="i-users" viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3.6 19c.5-3 2.7-4.7 5.4-4.7s4.9 1.7 5.4 4.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M15.5 5.2a3.2 3.2 0 0 1 0 5.6M17 14.6c2 .4 3.2 1.9 3.6 4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </symbol>
        <symbol id="i-sparkle" viewBox="0 0 24 24">
            <path d="M12 3.4l2 5.6 5.6 2-5.6 2-2 5.6-2-5.6-5.6-2 5.6-2 2-5.6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </symbol>
    </defs>
</svg>

<!-- الخلفيات -->
<div class="bg-stack" id="bgStack" aria-hidden="true">
    <div class="bg"></div>
    <div class="bg"></div>
    <div class="bg"></div>
    <div class="bg"></div>
</div>
<div class="scrim" aria-hidden="true"></div>
<div class="pattern" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>

<div class="ui">

    <header class="topbar">
        <div class="brand">
            <span class="flag" aria-hidden="true"></span>
            <div class="brand__txt">
                <div class="brand__name" id="serverName">OMAN ROLEPLAY</div>
                <div class="brand__sub" data-i18n="brandSub">اليوم الوطني العُماني</div>
            </div>
        </div>

        <div class="topbar__actions">
            <button class="icon-btn" id="musicBtn" type="button" hidden>
                <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
            </button>
            <input type="range" id="volumeSlider" class="volume" min="0" max="100" step="1" value="30" hidden aria-label="Volume" />
            <button class="icon-btn" id="trackBtn" type="button" hidden aria-label="Switch track">
                <svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px">
                    <path d="M5 5v14l9-7-9-7Zm11 0h3v14h-3V5Z" fill="currentColor"/>
                </svg>
            </button>
            <button class="icon-btn icon-btn--text" id="langBtn" type="button">
                <span id="langLabel">EN</span>
            </button>
        </div>
    </header>

    <main class="hero">
        <div class="eyebrow">
            <span class="eyebrow__line"></span>
            <span data-i18n="eyebrow">سلطنة عُمان · الثامن عشر من نوفمبر</span>
            <span class="eyebrow__line"></span>
        </div>

        <h1 class="title">
            <span class="title__a" data-i18n="titleA">اليوم عُمان</span>
            <span class="title__b" data-i18n="titleB">الوطني</span>
        </h1>

        <div class="ornament" aria-hidden="true">
            <span class="ornament__line"></span>
            <svg class="medallion" viewBox="0 0 120 120">
                <defs>
                    <linearGradient id="mGold" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#F9E9BF"/>
                        <stop offset=".5" stop-color="#E3B95B"/>
                        <stop offset="1" stop-color="#A87A28"/>
                    </linearGradient>
                    <mask id="mCrescent">
                        <rect width="120" height="120" fill="#000"/>
                        <circle cx="60" cy="60" r="17" fill="#fff"/>
                        <circle cx="68.5" cy="54.5" r="15.4" fill="#000"/>
                    </mask>
                </defs>
                <circle cx="60" cy="60" r="56" fill="none" stroke="url(#mGold)" stroke-opacity=".5" stroke-width="1"/>
                <g class="medallion__spin">
                    <circle cx="60" cy="60" r="50" fill="none" stroke="url(#mGold)" stroke-opacity=".32"
                            stroke-width="1" stroke-dasharray="1 5" stroke-linecap="round"/>
                </g>
                <g fill="none" stroke="url(#mGold)" stroke-opacity=".5" stroke-width="1">
                    <rect x="31" y="31" width="58" height="58" rx="3"/>
                    <rect x="31" y="31" width="58" height="58" rx="3" transform="rotate(45 60 60)"/>
                </g>
                <circle cx="60" cy="60" r="20" fill="url(#mGold)" mask="url(#mCrescent)"/>
                <circle cx="79" cy="45" r="2.1" fill="url(#mGold)"/>
            </svg>
            <span class="ornament__line"></span>
        </div>

        <p class="subtitle" data-i18n="subtitle">
            في الثامن عشر من نوفمبر انطلقت مسيرة النهضة الحديثة… فكل عام وعُمان في عزٍّ ومجد.
        </p>

        <div class="countdown" id="countdownWrap">
            <div class="countdown__title" id="cdTitle"></div>
            <div class="countdown__grid" id="countdown">
                <div class="cd">
                    <span class="cd__n" id="cdDays">00</span>
                    <span class="cd__l" data-i18n="days">يوم</span>
                </div>
                <div class="cd">
                    <span class="cd__n" id="cdHours">00</span>
                    <span class="cd__l" data-i18n="hours">ساعة</span>
                </div>
                <div class="cd">
                    <span class="cd__n" id="cdMinutes">00</span>
                    <span class="cd__l" data-i18n="minutes">دقيقة</span>
                </div>
                <div class="cd">
                    <span class="cd__n" id="cdSeconds">00</span>
                    <span class="cd__l" data-i18n="seconds">ثانية</span>
                </div>
            </div>
            <div class="celebration" id="celebration" hidden>
                <div class="celebration__main" data-i18n="celebration">كل عام وعُمان بخير</div>
                <div class="celebration__sub" id="celebrationSub"></div>
            </div>
        </div>

        <div class="progress">
            <div class="progress__head">
                <span class="progress__status" id="statusText" data-i18n="loading">جارٍ التحميل…</span>
                <span class="progress__pct" id="progressPct">0%</span>
            </div>
            <div class="progress__track">
                <div class="progress__fill" id="progressFill"></div>
            </div>
        </div>

        <figure class="tip">
            <svg class="tip__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sparkle"/></svg>
            <figcaption class="tip__body">
                <span class="tip__label" data-i18n="tipLabel">هل تعلم؟</span>
                <span class="tip__text" id="tipText"></span>
            </figcaption>
        </figure>
    </main>

    <footer class="bottombar">
        <div class="player" id="playerBlock">
            <div class="player__label" data-i18n="welcome">مرحبًا بك</div>
            <div class="player__name" id="playerName" hidden></div>
            <div class="player__meta">
                <span class="chip" id="playerCount" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-users"/></svg>
                    <span id="playerCountText"></span>
                </span>
                <span class="chip chip--status" id="statusChip">
                    <i class="dot" aria-hidden="true"></i>
                    <span data-i18n="online">السيرفر متصل</span>
                </span>
            </div>
        </div>

        <nav class="socials" id="socials" aria-label="Social links"></nav>

        <div class="build" id="buildVersion">v1.0.0</div>
    </footer>

</div>

<audio id="theme" preload="auto" autoplay loop playsinline></audio>
<script src="js/app.js"></script>
</body>
</html>
